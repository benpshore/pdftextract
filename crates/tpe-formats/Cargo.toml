[package]
name = "tpe-formats"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Text and structure extraction from non-PDF inputs: docx, pptx, xlsx, csv/tsv, html, md, txt, Apple Pages/Numbers packages and local audio transcription"

[lib]
name = "tpe_formats"
path = "src/lib.rs"

[[bin]]
name = "tpe-formats"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
roxmltree = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
walkdir = "2"
# Already in the lock tree (office_oxide). Deflate through the flate2 zlib-rs
# backend the engine builds anyway; no encryption, bzip2, zstd or xz.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
