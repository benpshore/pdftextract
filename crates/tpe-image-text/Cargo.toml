[package]
name = "tpe-image-text"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Image to text: OCR of still images with one text and one JSON report per input, by whichever engine is really installed"

[features]
default = ["ocrs"]
# Pure-Rust OCR (ocrs on rten); needs the two pinned models, see models/manifest.json.
ocrs = ["dep:ocrs", "dep:rten", "dep:rten-imageproc"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
# Only the decoders this tool accepts; no AVIF/EXR/QOI encoders are compiled in.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
ocrs = { version = "=0.13.1", default-features = false, features = ["rten"], optional = true }
rten = { version = "=0.26.0", default-features = false, features = ["rten_format"], optional = true }
rten-imageproc = { version = "=0.26.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[[bin]]
name = "tpe-image-text"
path = "src/bin/tpe-image-text.rs"

[lints]
workspace = true
