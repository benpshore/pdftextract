name: PDF operations safety

on:
  pull_request:
    paths:
      - 'crates/tpe-pdfops/**'
      - 'Cargo.lock'
      - '.github/workflows/pdfops-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdfops:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p tpe-pdfops --all-targets -- -D warnings
      - run: cargo test --locked -p tpe-pdfops
      - run: cargo clippy --locked -p tpe-pdfops --all-targets --features pdfium -- -D warnings
      - run: cargo test --locked -p tpe-pdfops --features pdfium
