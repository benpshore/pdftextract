name: Web alpha source

on:
  pull_request:
    paths: [web/**, scripts/site_source.py, scripts/test-site-*.mjs, scripts/test-web-*.cjs, .github/workflows/web.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Create local-only storage binding configuration
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync(".openai", {recursive:true}); fs.writeFileSync(".openai/hosting.json", JSON.stringify({d1:"DB",r2:"BUCKET"}));'
      - run: node scripts/copy-pdf-wasm.mjs
      - run: node scripts/copy-ocr-assets.mjs
      - run: pnpm exec tsc --noEmit
      - run: node scripts/test-clip.mjs
      - run: node scripts/test-web-extraction-review.mjs
      - run: node scripts/test-import-flow.mjs
      - run: node scripts/test-office.mjs
      - run: node scripts/test-node-imports.mjs
      - run: node ../scripts/test-web-workspace.cjs
      - run: node --experimental-strip-types ../scripts/test-site-mcp.mjs
      - run: node --experimental-strip-types ../scripts/test-site-uploads-workers.mjs
      - name: Install pinned browser-test tools without package hooks
        run: npm ci --prefix scripts/browser-tools --ignore-scripts
      - name: Install test Chromium
        run: node scripts/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Stage verified Docling CPU runtime and models explicitly
        run: node scripts/stage-docling-assets.mjs --models
      - name: Real browser PDF API, model inference, interruption and resource evidence
        env:
          PLAYWRIGHT_MODULE: ./browser-tools/node_modules/playwright/index.mjs
          PDF_LIB_MODULE: ./browser-tools/node_modules/pdf-lib/cjs/index.js
          EVIDENCE_PATH: docling-browser-evidence.json
        run: node scripts/test-docling-browser.mjs
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docling-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            web/docling-browser-evidence.json
            web/docling-browser-evidence.png
          if-no-files-found: warn
      - run: pnpm run build
