name: Source mapping region selection pilot

on:
  pull_request:
    paths:
      - experiments/source-fusion/**
      - experiments/region-fusion/**
      - experiments/region-evidence/**
      - rust-toolchain.toml
      - native/manifest.json
      - .github/workflows/source-fusion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-source-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      PDFIUM_DYNAMIC_LIB_PATH: ${{ github.workspace }}/.pdfium/lib/libpdfium.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Record actual toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version
      - name: Source verifier, selector and CLI checks
        run: |
          cargo fmt --manifest-path experiments/source-fusion/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/source-fusion/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/source-fusion/Cargo.toml
      - name: New orchestration and retained lifecycle checks
        run: |
          uv run --locked pytest experiments/source-fusion/test_evaluate.py
          uv run --locked pytest experiments/source-fusion/test_runner.py
          uv run --locked pytest experiments/region-fusion/test_runner.py
      - name: Fetch existing pinned PDFium runtime
        shell: bash
        run: |
          set -euo pipefail
          entry=$(jq -ce '[.entries[] | select(.kind == "pdfium" and .platform == "linux-x64")] | if length == 1 then .[0] else error("expected one pin") end' native/manifest.json)
          curl --fail --location --retry 3 "$(jq -er '.url' <<< "$entry")" -o /tmp/source-fusion-pdfium.tgz
          printf '%s  /tmp/source-fusion-pdfium.tgz\n' "$(jq -er '.archive_sha256' <<< "$entry")" | sha256sum --check
          mkdir -p .pdfium
          tar -xzf /tmp/source-fusion-pdfium.tgz -C .pdfium lib/libpdfium.so
          printf '%s  .pdfium/lib/libpdfium.so\n' "$(jq -er '.sha256' <<< "$entry")" | sha256sum --check
      - name: Build test executables
        run: |
          cargo build --locked --features pdfium --bin tpe
          cargo build --locked --manifest-path experiments/source-fusion/Cargo.toml --bin fuse_source
      - name: Actual extraction with evaluation truth outside selector inputs
        env:
          SOURCE_TPE_BIN: ${{ github.workspace }}/target/debug/tpe
          SOURCE_FUSION_BIN: ${{ github.workspace }}/experiments/source-fusion/target/debug/fuse_source
        run: uv run --locked pytest --basetemp /tmp/source-fusion-qualification experiments/source-fusion/test_real_extraction.py
      - name: Retain qualification outputs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-fusion-qualification
          path: |
            /tmp/source-fusion-qualification
            !/tmp/source-fusion-qualification/**/*.sqlite
            !/tmp/source-fusion-qualification/**/*.sqlite-*
          if-no-files-found: warn
